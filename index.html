<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrHieu298's Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@800;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
    --mhp-blue: #2185d5;
    --mhp-dark: #1a4f7a;
    --bg-gradient: radial-gradient(circle at top right, #f0f4f8, #d9e2ec);
    --glass: rgba(255, 255, 255, 0.85);
}

body {
    margin: 0; padding: 0;
    font-family: 'Quicksand', sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh; /* Sửa height thành min-height để điện thoại có thể cuộn */
    display: flex; flex-direction: column;
    overflow-x: hidden;
    overflow-y: auto; /* Cho phép cuộn dọc trên di động */
    position: relative;
}

.physics-bg {
    position: fixed; /* Giữ nền cố định khi cuộn trang */
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: -1; opacity: 0.4;
}

header {
    padding: 20px 0;
    display: flex; flex-direction: column; /* Xếp dọc trên điện thoại */
    align-items: center; justify-content: center; gap: 15px;
    z-index: 10;
}

.logo-img { height: 100px; width: auto; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); }

.title-3d {
    font-family: 'Exo 2', sans-serif; font-size: 2.2rem; margin: 0;
    background: linear-gradient(135deg, var(--mhp-blue), var(--mhp-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 2px 0px white); text-align: center;
}

.wrapper {
    display: flex; flex-direction: column; /* Mặc định xếp dọc cho điện thoại */
    flex: 1; padding: 20px; gap: 20px;
}

/* HIỂN THỊ TRÊN MÁY TÍNH & TABLET LỚN */
@media (min-width: 992px) {
    header { flex-direction: row; gap: 25px; }
    .logo-img { height: 130px; }
    .title-3d { font-size: 3.5rem; }
    .wrapper { flex-direction: row; padding: 0 50px 80px 50px; max-height: 70vh; gap: 40px; }
    .profile-card { flex: 5; flex-direction: row; text-align: left; }
    .projects-container { flex: 5; }
    .avatar-box { width: 250px; height: 250px; }
}

.profile-card, .projects-container {
    background: var(--glass); border-radius: 40px;
    backdrop-filter: blur(20px); border: 2px solid white;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}

.profile-card { padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 25px; }

.avatar-box {
    flex-shrink: 0; width: 180px; height: 180px;
    border-radius: 30px; border: 6px solid white;
    overflow: hidden; background: #fff;
    display: flex; justify-content: center; align-items: center;
}

.avatar-box img { width: 100%; height: 100%; object-fit: contain; }

.projects-container { display: flex; flex-direction: column; overflow: hidden; }
.projects-header { padding: 25px; text-align: center; background: rgba(255,255,255,0.3); }
.header-3d-text { font-family: 'Exo 2', sans-serif; font-size: 1.8rem; color: var(--mhp-blue); text-transform: uppercase; }

.project-list { flex: 1; overflow-y: auto; padding: 15px 25px; }
.btn-project {
    display: flex; align-items: center; background: white; margin-bottom: 12px; padding: 18px;
    border-radius: 18px; text-decoration: none; color: var(--mhp-dark); font-weight: 700;
    border-left: 6px solid var(--mhp-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
</head>
